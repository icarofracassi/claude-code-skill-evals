name: Eval Submitted Skill

on:
  issues:
    types: [opened, labeled]

permissions:
  issues: write
  contents: read

jobs:
  # ── Job 1: structural lint (Node.js, no API key needed) ────────────────────
  lint:
    name: Lint skill structure
    if: >
      (github.event.action == 'labeled' && github.event.label.name == 'status: eval-pending') ||
      (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'status: eval-pending'))
    runs-on: ubuntu-latest
    outputs:
      skill_found: ${{ steps.lint.outputs.skill_found }}

    steps:
      - uses: actions/checkout@v4

      - name: Write issue body to file
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: printf '%s' "$ISSUE_BODY" > /tmp/issue_body.txt

      - name: Run structural lint
        id: lint
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('/tmp/issue_body.txt', 'utf8');

            function extractSection(body, label) {
              const pattern = new RegExp(
                '### ' + label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\s*\\n+([\\s\\S]*?)(?=\\n### |$)'
              );
              const m = body.match(pattern);
              return m ? m[1].trim() : '';
            }

            function stripFence(text) {
              const m = text.match(/```[a-z]*\n?([\s\S]*?)```/);
              return m ? m[1].trim() : text.trim();
            }

            const PASS = (msg, detail) => '✅ [PASS] ' + msg + (detail ? '\n         ' + detail : '');
            const WARN = (msg, detail) => '⚠️  [WARN] ' + msg + (detail ? '\n         ' + detail : '');
            const FAIL = (msg, detail) => '❌ [FAIL] ' + msg + (detail ? '\n         ' + detail : '');

            let raw = extractSection(body, 'Skill file content');
            if (!raw) {
              core.setOutput('skill_found', 'false');
              fs.writeFileSync('/tmp/lint_report.txt',
                '❌ Could not extract skill content from issue body.\n   Use the Submit a Skill issue template.');
              return;
            }
            const skill = raw.includes('```') ? stripFence(raw) : raw;
            core.setOutput('skill_found', 'true');

            const lines = [];
            lines.push('='.repeat(60));
            lines.push('EVAL 1 — Structure / Lint (Node.js, no API key)');
            lines.push('='.repeat(60));

            lines.push(skill.startsWith('---')
              ? PASS('Starts with YAML frontmatter')
              : FAIL('Missing opening --- frontmatter block'));

            lines.push(/^name:\s*\S+/m.test(skill)
              ? PASS('`name` field present')
              : FAIL('`name` field missing from frontmatter'));

            lines.push(/^description:/m.test(skill)
              ? PASS('`description` field present')
              : FAIL('`description` field missing from frontmatter'));

            const hasTrigger = ['trigger', 'use when', 'use this when', 'whenever', 'invoke']
              .some(kw => skill.toLowerCase().includes(kw));
            lines.push(hasTrigger
              ? PASS('Description includes trigger conditions')
              : WARN('No trigger language found', "Add phrases like 'Use when...' or 'Trigger on:'"));

            const hasExclusion = ['do not', "don't", 'not trigger', 'exclude', 'only when']
              .some(kw => skill.toLowerCase().includes(kw));
            lines.push(hasExclusion
              ? PASS('Description includes exclusion conditions (Do NOT...)')
              : WARN('No exclusion language found', "Add 'Do NOT trigger on:' to prevent false positives"));

            const placeholders = (skill.match(/PLACEHOLDER|TODO:/g) || []).length;
            lines.push(placeholders === 0
              ? PASS('No unresolved placeholders')
              : WARN(placeholders + ' unresolved placeholder(s) found',
                  'Resolve or remove PLACEHOLDER / TODO: blocks before publishing'));

            const words = skill.split(/\s+/).filter(Boolean).length;
            const lengthOk = words >= 30 && words <= 3000;
            lines.push(lengthOk
              ? PASS('Skill length OK (' + words + ' words)')
              : WARN('Skill length unusual (' + words + ' words)',
                  words < 30 ? 'Too short — may be too vague' : 'Very long — may exceed context window'));

            const testRaw = extractSection(body, 'Test cases (YAML, optional)');
            if (testRaw && testRaw.trim()) {
              const testClean = testRaw.includes('```') ? stripFence(testRaw) : testRaw;
              lines.push((/^- /m.test(testClean) && /prompt:/m.test(testClean))
                ? PASS('Test cases YAML structure looks valid')
                : WARN('Test cases YAML may be malformed', "Expected a YAML list with 'prompt:' keys"));
            } else {
              lines.push(WARN('No test cases provided',
                'Add test cases to enable Evals 3 and 4 (output quality + scope adherence)'));
            }

            const report = lines.join('\n');
            fs.writeFileSync('/tmp/lint_report.txt', report);
            console.log(report);

      - name: Post lint results as comment
        uses: actions/github-script@v7
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/lint_report.txt', 'utf8');
            const hasKey = process.env.HAS_KEY === 'true';
            const aiNote = hasKey
              ? '_AI evals (trigger precision, output quality, scope adherence) will follow in the next job._'
              : '> **Info: AI evals skipped** — add `ANTHROPIC_API_KEY` to repository secrets to enable LLM-based checks.';
            github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
              body: '## Skill Eval Results\n\n```\n' + report + '\n```\n\n' + aiNote +
                    '\n\n---\n_[workflow run](' + context.serverUrl + '/' + context.repo.owner +
                    '/' + context.repo.repo + '/actions/runs/' + context.runId + ')_'
            });

  # ── Job 2: AI evals (Python + Anthropic, only if API key is set) ───────────
  ai-eval:
    name: AI evals (trigger precision, output quality, scope adherence)
    needs: lint
    if: >
      needs.lint.outputs.skill_found == 'true' && (
        (github.event.action == 'labeled' && github.event.label.name == 'status: eval-pending') ||
        (github.event.action == 'opened' && contains(github.event.issue.labels.*.name, 'status: eval-pending'))
      )
    runs-on: ubuntu-latest

    steps:
      - name: Check API key is present
        id: check-key
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Post skip notice if no API key
        if: steps.check-key.outputs.skip == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
              body: '> **Info: AI evals skipped** — add `ANTHROPIC_API_KEY` to repository secrets to enable LLM-based checks (trigger precision, output quality, scope adherence).'
            });

      - uses: actions/checkout@v4
        if: steps.check-key.outputs.skip == 'false'

      - uses: actions/setup-python@v5
        if: steps.check-key.outputs.skip == 'false'
        with:
          python-version: '3.11'

      - run: pip install anthropic pyyaml
        if: steps.check-key.outputs.skip == 'false'

      - name: Write issue body to file
        if: steps.check-key.outputs.skip == 'false'
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: printf '%s' "$ISSUE_BODY" > /tmp/issue_body.txt

      - name: Run AI evals
        if: steps.check-key.outputs.skip == 'false'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/eval_skill.py > /tmp/eval_report.txt 2>&1
        continue-on-error: true

      - name: Post AI eval results as comment
        if: steps.check-key.outputs.skip == 'false'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/eval_report.txt', 'utf8');
            const truncated = report.length > 60000
              ? report.slice(0, 60000) + '\n\n... (truncated)'
              : report;
            github.rest.issues.createComment({
              owner:        context.repo.owner,
              repo:         context.repo.repo,
              issue_number: context.issue.number,
              body: '### AI Eval Results\n\n```\n' + truncated + '\n```\n\n---\n_[workflow run](' +
                    context.serverUrl + '/' + context.repo.owner + '/' + context.repo.repo +
                    '/actions/runs/' + context.runId + ')_'
            });
